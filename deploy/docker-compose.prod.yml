# Production stack on one server (Stage 8, D21 — confirm sizing and hosting).
#   cp deploy/.env.example deploy/.env   # fill in, never commit
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d db
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env run --rm migrate
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env run --rm seed     # first super administrator only
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
services:
  db:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment: { POSTGRES_DB: dhruv_erp, POSTGRES_USER: dhruv, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}" }
    volumes: [ "pgdata:/var/lib/postgresql/data", "./backups:/backups" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dhruv -d dhruv_erp"], interval: 10s, retries: 10 }

  migrate:
    image: "dhruv-erp:${APP_VERSION:?set APP_VERSION}"
    profiles: [ "ops" ]
    command: [ "node", "dist/db/migrate.js" ]
    environment: &env
      NODE_ENV: production
      DATABASE_URL: "postgres://dhruv:${DB_PASSWORD}@db:5432/dhruv_erp"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY}"
      WEB_ORIGIN: "https://${ERP_DOMAIN:?set ERP_DOMAIN}"
      STORAGE_DIR: /app/storage
      RUN_RELAY: "false"
    depends_on: { db: { condition: service_healthy } }

  seed:
    image: "dhruv-erp:${APP_VERSION}"
    profiles: [ "ops" ]
    command: [ "node", "dist/db/seed.js" ]
    environment:
      <<: *env
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL}"
      BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD}"
    depends_on: { db: { condition: service_healthy } }

  api:
    image: "dhruv-erp:${APP_VERSION}"
    restart: unless-stopped
    environment: *env
    volumes: [ "files:/app/storage" ]
    depends_on: { db: { condition: service_healthy } }

  worker:
    image: "dhruv-erp:${APP_VERSION}"
    restart: unless-stopped
    command: [ "node", "dist/worker.js" ]
    environment:
      <<: *env
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMS_TOKEN: "${SMS_TOKEN:-}"
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN:-}"
    volumes: [ "files:/app/storage" ]
    depends_on: { db: { condition: service_healthy } }

  web:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment: { ERP_DOMAIN: "${ERP_DOMAIN}" }
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data", "webroot:/srv" ]
    depends_on: [ api ]

  # copies the built web app out of the image into the volume Caddy serves
  webroot:
    image: "dhruv-erp:${APP_VERSION}"
    command: [ "sh", "-c", "rm -rf /srv/* && cp -r /web/. /srv/" ]
    user: root
    volumes: [ "webroot:/srv" ]

volumes: { pgdata: {}, files: {}, caddy: {}, webroot: {} }
